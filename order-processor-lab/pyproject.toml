[project]
name = "order-processor-lab"
version = "0.1.0"
description = "Лабораторный проект: модели заказов на Pydantic v2"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F — ошибки, I — порядок импортов, UP — современный синтаксис, B — баги, T20 — запрет print()
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
